---

name: Lint CSV Configs

on:
  push:
    branches: [latest]
    paths:
      - '**.csv'
      - '.github/workflows/csv_lint.yml'
  pull_request:
    branches: [latest]
    paths:
      - '**.csv'
      - '.github/workflows/csv_lint.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: csvlinter
        uses: kcheriyath/csvlinter@V0.6.0
        with:
          find_pattern: '*.csv'
