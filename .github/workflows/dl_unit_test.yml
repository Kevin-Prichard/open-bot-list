---

name: Unit Test Downloader

on:
  push:
    branches: [latest]
    paths:
      - 'downloader/**.go'
      - '.github/workflows/dl_unit_test.yml'
      - 'scripts/unit_test_downloader.sh'
  pull_request:
    branches: [latest]
    paths:
      - 'downloader/**.go'
      - '.github/workflows/dl_unit_test.yml'
      - 'scripts/unit_test_downloader.sh'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'downloader/go.mod'

      - name: Install dependencies
        run: |
          sudo apt install git
          go install gotest.tools/gotestsum@latest

      - name: Building Go Binary
        run: bash scripts/build_downloader.sh
        env:
          MODE_TEST: '1'

      - name: Running Go Tests
        run: bash scripts/unit_test_downloader.sh
